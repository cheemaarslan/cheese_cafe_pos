; Local development override, loaded on top of the shared WAMP php.ini via the
; PHP_INI_SCAN_DIR environment variable that serve.bat sets before starting
; `php artisan serve`. Only affects that command for this project — it does
; not touch E:\wamp64\bin\php\php8.4.15\php.ini, so every other site on this
; machine keeps its normal PHP settings.
;
; This app is built on Laravel 9, written before PHP 8.4 existed. Under 8.4,
; a lot of framework/vendor code triggers "implicitly nullable parameter"
; E_DEPRECATED notices. Laravel's own handler quietly logs these to the
; "deprecations" log channel once it boots, but a few fire during Composer's
; autoloading, before that handler is registered, and get printed raw into
; the response as PHP's HTML error table. Excluding E_DEPRECATED from
; error_reporting stops that noise; real warnings/notices/errors still show.
error_reporting = E_ALL & ~E_DEPRECATED
